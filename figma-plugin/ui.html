<style>
  body {
    font:
      13px system-ui,
      sans-serif;
    margin: 12px;
  }
  button {
    padding: 8px 12px;
  }
  #log {
    margin-top: 8px;
    white-space: pre-wrap;
    color: #555;
    max-height: 120px;
    overflow: auto;
  }
</style>
<p>
  Selecione os frames e clique em exportar. Salve o <code>.zip</code> e me avise
  o caminho.
</p>
<button id="go">Exportar seleção</button>
<div id="log"></div>
<script>
  const log = (t) => (document.getElementById("log").textContent += t + "\n");
  document.getElementById("go").onclick = () =>
    parent.postMessage({ pluginMessage: { type: "export" } }, "*");

  // ZIP sem compressão (STORE): suficiente e sem dependências.
  const crcTable = Array.from({ length: 256 }, (_, n) => {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    return c >>> 0;
  });
  const crc32 = (b) => {
    let c = 0xffffffff;
    for (let i = 0; i < b.length; i++)
      c = crcTable[(c ^ b[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  };
  function zip(files) {
    const enc = new TextEncoder();
    const parts = [],
      central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.path);
      const data = f.bytes ? new Uint8Array(f.bytes) : enc.encode(f.data);
      const crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true);
      h.setUint16(4, 20, true);
      h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true);
      h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true);
      c.setUint16(4, 20, true);
      c.setUint16(6, 20, true);
      c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true);
      c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true);
      c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const size = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true);
    e.setUint16(8, files.length, true);
    e.setUint16(10, files.length, true);
    e.setUint32(12, size, true);
    e.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {
      type: "application/zip",
    });
  }

  onmessage = (ev) => {
    const msg = ev.data.pluginMessage;
    if (msg.type === "log") return log(msg.text);
    if (msg.type === "zip") {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(zip(msg.files));
      a.download = "figma-export.zip";
      a.click();
      log(`Pronto: ${msg.files.length} arquivos em figma-export.zip`);
    }
  };
</script>
